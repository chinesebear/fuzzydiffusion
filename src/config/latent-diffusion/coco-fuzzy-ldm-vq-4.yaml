# DFS on MS COCO (text-conditional, VQ-f4, 256 -> 64x64 latent).
# BERT is used both as the text conditioning encoder and (through BLIP
# captions) as the semantic branch of SMC, matching Sec. III.B.
model:
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    base_learning_rate: 2.0e-06
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    image_size: 64
    channels: 3
    cond_stage_trainable: false
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    ckpt_path: "output/models/ldm/text2img256/model.ckpt"

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3
        out_channels: 3
        model_channels: 192
        attention_resolutions: [ 8, 4, 2 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 3, 5 ]
        num_head_channels: 32
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 640

    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        ckpt_path: "output/models/first_stage_models/vq-f4/model.ckpt"
        embed_dim: 3
        n_embed: 8192
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1, 2, 4 ]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.BERTEmbedder
      params:
        n_embed: 640
        n_layer: 32

fuzzy:
  rule_num: 3
  alpha: 0.7           # paper: MS COCO optimum alpha = 0.7
  beta_1: 0.0015
  beta_T: 0.0195
  T: 1000
  ddim_steps: 1000
  cfg_scale: 7.5
  smc_every: 1
  delegate_path: "output/delegates/coco/coco_3_delegates.csv"
