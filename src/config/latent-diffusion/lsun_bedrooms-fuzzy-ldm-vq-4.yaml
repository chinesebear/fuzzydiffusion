# DFS on LSUN Bedroom (VQ-f4, 256 -> 64x64 latent), paper Sec. IV.
model:
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    image_size: 64
    channels: 3
    monitor: val/loss_simple_ema
    ckpt_path: "output/models/ldm/lsun_beds256/model.ckpt"

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 3
        out_channels: 3
        model_channels: 224
        attention_resolutions: [ 8, 4, 2 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 3, 4 ]
        num_head_channels: 32

    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        ckpt_path: "output/models/first_stage_models/vq-f4/model.ckpt"
        embed_dim: 3
        n_embed: 8192
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1, 2, 4 ]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config: __is_unconditional__

fuzzy:
  rule_num: 3
  alpha: 0.3
  beta_1: 0.0015
  beta_T: 0.0195
  T: 1000
  ddim_steps: 1000
  cfg_scale: 1.0
  smc_every: 1
  delegate_path: "output/delegates/lsun_bedroom/lsun_bedroom_3_delegates.csv"
