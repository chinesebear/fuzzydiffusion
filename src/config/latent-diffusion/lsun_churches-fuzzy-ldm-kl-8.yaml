# DFS on LSUN Church (KL-f8, 256 -> 32x32 latent), paper Sec. IV.
# `model` describes the frozen latent-diffusion backbone; its UNet initialises
# the K rule models.  `fuzzy` configures FuzzyLatentDiffusion (Algorithm 1/2).
model:
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0155
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: "image"
    cond_stage_key: "image"
    image_size: 32
    channels: 4
    cond_stage_trainable: False
    concat_mode: False
    scale_by_std: True
    monitor: 'val/loss_simple_ema'
    # Paths are resolved relative to the repository root by utils.load_config.
    ckpt_path: "output/models/ldm/lsun_churches256/model.ckpt"

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 192
        attention_resolutions: [ 1, 2, 4, 8 ]
        num_res_blocks: 2
        channel_mult: [ 1,2,2,4,4 ]
        num_heads: 8
        use_scale_shift_norm: True
        resblock_updown: True

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: "val/rec_loss"
        ckpt_path: "output/models/first_stage_models/kl-f8/model.ckpt"
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [ 1,2,4,4 ]
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config: "__is_unconditional__"

fuzzy:
  rule_num: 3          # K
  alpha: 0.3           # paper: LSUN optimum alpha = 0.3
  beta_1: 0.0015
  beta_T: 0.0155
  T: 1000
  ddim_steps: 1000     # paper: all methods use 1,000 sampling steps
  cfg_scale: 1.0       # unconditional
  smc_every: 1         # DFIE membership at every reverse step
  delegate_path: "output/delegates/lsun_church/lsun_church_3_delegates.csv"
